# Mugshot Android APK 构建
# - push 到 master/main：构建并上传 artifact，同时刷新滚动预发布 dev 的 APK
# - push tag v* 时：构建并附加到 GitHub Release
# - 发布签名：仓库内置 keystore（android/app/mugshot-release.keystore，PKCS12），
#   构建出的 release APK 已签名可直接安装，并用 apksigner verify 校验
name: build-android

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          # 版本号 = 提交短哈希；更新检查 = 发布 tag（非 tag 构建为 0.0.0）
          GIT_TAG="${GITHUB_REF_NAME#v}"
          [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ] || GIT_TAG="0.0.0"
          ./gradlew --no-daemon -PgitHash=${GITHUB_SHA::8} -PgitTag="$GIT_TAG" testDebugUnitTest assembleRelease

      - name: Verify APK signature
        working-directory: android
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Rename artifact
        working-directory: android
        run: |
          VER=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            NAME="Mugshot-${GITHUB_REF_NAME#v}-release.apk"
          else
            NAME="Mugshot-dev-release.apk"
          fi
          cp app/build/outputs/apk/release/*.apk "$NAME"
          echo "VER=$VER" >> "$GITHUB_ENV"
          ls -la *.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mugshot-apk
          path: android/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 若 Release 不存在则自动创建（下载页面），随后附加已签名 APK
          gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
              --title "Mugshot ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" android/Mugshot-*-release.apk --clobber --repo "$GITHUB_REPOSITORY"

      - name: Update rolling dev release
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 每次推送都刷新 dev 预发布（latest 接口不会返回预发布，不影响正式更新检查）
          gh release view dev --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create dev --repo "$GITHUB_REPOSITORY" --prerelease \
              --title "Mugshot 开发构建" \
              --notes "每次推送 master 自动编译：APK（版本 ${VER}）与服务端 Linux ARM64 产物，均为最新提交构建。"
          gh release upload dev android/Mugshot-dev-release.apk --clobber --repo "$GITHUB_REPOSITORY"
