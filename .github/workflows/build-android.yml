# Mugshot Android APK 构建
# - push 到 master 且改动 android/** 时：构建并上传 artifact
# - push tag v* 时：构建并附加到 GitHub Release
# - 发布签名：仓库内置 keystore（android/app/mugshot-release.keystore，PKCS12），
#   构建出的 release APK 已签名可直接安装，并用 apksigner verify 校验
name: build-android

on:
  push:
    branches: [master, main]
    paths: ["android/**", ".github/workflows/build-android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Verify APK signature
        working-directory: android
        run: |
          BT=$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)
          "$ANDROID_HOME/build-tools/$BT/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk

      - name: Rename artifact
        working-directory: android
        run: |
          VER="${GITHUB_REF_NAME#v}"
          cp app/build/outputs/apk/release/*.apk "Mugshot-${VER}-release.apk"
          ls -la *.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mugshot-apk
          path: android/*.apk

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 若 Release 不存在则自动创建（下载页面），随后附加已签名 APK
          gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
              --title "Mugshot ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" android/Mugshot-*-release.apk --clobber --repo "$GITHUB_REPOSITORY"
