# mugshot-server Linux ARM64 构建（适配 Ubuntu 26.04 ARM64 服务器）
# - push tag v* 时：构建并附加到 GitHub Release（tar.gz + 裸二进制）
# - 同时打包 Yunzai 插件目录为 mugshot-plugin.tar.gz，供插件更新器下载
name: build-linux-arm64

on:
  push:
    branches: [master, main]
    paths: ["server/**", "plugins/**", ".github/workflows/build-linux-arm64.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  server:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: Determine version
        id: ver
        run: |
          # 软件版本号 = 构建时的 Git 短哈希；更新检查用发布 tag（非 tag 构建为 0.0.0）
          echo "version=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "release_tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "release_tag=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Install GUI build dependencies
        run: |
          # mugshot-gui 基于 Fyne，需要 cgo 与 GL/X11/Wayland 开发头文件
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1-mesa-dev xorg-dev libgbm-dev libwayland-dev

      - name: Vet (含 GUI 包)
        working-directory: server
        env:
          CGO_ENABLED: "1"
        run: go vet ./...

      - name: Build server (linux/arm64)
        working-directory: server
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }} -X main.releaseTag=${{ steps.ver.outputs.release_tag }} -X main.commit=${GITHUB_SHA::8}" \
            -o mugshot-server .

      - name: Build GUI (linux/arm64)
        working-directory: server
        run: |
          # GUI 走本机原生 arm64 构建，CGO 打开
          go build -trimpath -ldflags "-s -w" -o mugshot-gui ./cmd/mugshot-gui

      - name: Build .deb package
        working-directory: server
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh "${{ steps.ver.outputs.version }}" ./mugshot-server arm64 ./mugshot-gui

      - name: Package server
        working-directory: server
        run: |
          VER="${{ steps.ver.outputs.version }}"
          mkdir -p /tmp/pkg/mugshot
          cp mugshot-server /tmp/pkg/mugshot/
          cp mugshot-server.service install.sh /tmp/pkg/mugshot/
          tar -czf "mugshot-server_linux_arm64_${VER}.tar.gz" -C /tmp/pkg mugshot
          cp "mugshot-server_linux_arm64_${VER}.tar.gz" ../
          # 裸二进制不带版本后缀：服务端自更新备用源按此固定名拼 URL，且各 Release 下不冲突
          cp mugshot-server "../mugshot-server_linux_arm64"
          cp mugshot-gui "../mugshot-gui_linux_arm64"
          # deb 的 Version 字段要求以数字开头，build-deb.sh 会对字母开头的哈希补 0 前缀，用通配符匹配
          cp mugshot-server_*_arm64.deb ../
          ls -la ../*.tar.gz ../*.deb ../*arm64*

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mugshot-server-linux-arm64
          path: |
            mugshot-server_linux_arm64_*.tar.gz
            mugshot-server_linux_arm64
            mugshot-gui_linux_arm64
            mugshot-server_*_arm64.deb

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: Package plugin
        run: |
          VER="${{ steps.ver.outputs.version }}"
          # 插件更新器按 mugshot-plugin/<内容> 解包，目录名固定
          mkdir -p /tmp/pkg/mugshot-plugin
          cp -r plugins/mugshot/. /tmp/pkg/mugshot-plugin/
          tar -czf "mugshot-plugin_${VER}.tar.gz" -C /tmp/pkg mugshot-plugin
          ls -la mugshot-plugin_*.tar.gz

      - name: Publish plugin to main branch
        run: |
          # 把 plugins/mugshot 的内容作为仓库根目录发布到 main 分支，
          # 用户可直接: git clone -b main <repo> mugshot 装进 Yunzai plugins/
          # 每次生成孤儿提交快照后 force push，避免浅克隆缺少远端 main 父对象
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          TREE=$(git rev-parse HEAD:plugins/mugshot)
          COMMIT=$(git commit-tree "$TREE" -m "sync: 插件内容快照")
          git push origin "$COMMIT:refs/heads/main" --force
          echo "已发布插件内容到 main 分支"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mugshot-plugin
          path: mugshot-plugin_*.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [server, plugin]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 若 Release 不存在则自动创建（下载页面），随后附加全部产物
          gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" \
              --title "Mugshot ${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" dist/* --clobber --repo "$GITHUB_REPOSITORY"
