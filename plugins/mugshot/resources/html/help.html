<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "PingFang SC", "HarmonyOS Sans SC", "Microsoft YaHei", sans-serif; background: #0f1420; width: 720px; }
  .card { padding: 34px 38px; color: #e8ecf4; }
  .head { margin-bottom: 20px; }
  .title { font-size: 30px; font-weight: 700; margin-bottom: 8px; }
  .group { background: #172033; border: 1px solid #263150; border-radius: 14px; padding: 8px 22px; margin-bottom: 14px; }
  .group h3 { font-size: 17px; color: #7fb2ff; padding: 12px 0 2px; }
  .group .item { display: flex; padding: 10px 0; border-bottom: 1px solid #1f2a44; font-size: 15.5px; }
  .group .item:last-child { border-bottom: none; }
  .group .cmd { width: 210px; color: #ffd54f; font-weight: 600; flex-shrink: 0; }
  .group .desc { color: #b6bfcf; }
  .meta { font-size: 14px; color: #66708a; display: flex; justify-content: space-between; border-top: 1px solid #1f2a44; padding-top: 14px; margin-top: 6px; }
</style>
</head>
<body>
<div class="card">
  <div class="head"><div class="title">{{ title }}</div></div>
  {{ each groups g }}
  <div class="group">
    <h3>{{ g.name }}</h3>
    {{ each g.list i }}
    <div class="item"><span class="cmd">{{ i.cmd }}</span><span class="desc">{{ i.desc }}</span></div>
    {{ /each }}
  </div>
  {{ /each }}
  <div class="meta"><span>Mugshot · {{ server }}</span><span>发送 #群主帮助 随时查看</span></div>
</div>
</body>
</html>
